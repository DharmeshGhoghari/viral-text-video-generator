<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viral Text Video Generator</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --panel: rgba(15, 23, 42, 0.8);
            --muted: #94a3b8;
            --text: #e2e8f0;
            --line: rgba(148, 163, 184, 0.2);
            --accent-1: #ec4899;
            --accent-2: #f97316;
            --success: #86efac;
            --error: #fca5a5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app {
            width: min(960px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: clamp(24px, 5vw, 36px);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .language-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .lang-btn {
            border: 1px solid var(--line);
            background: rgba(148, 163, 184, 0.08);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.06em;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-color: var(--accent-1);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 780px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .controls {
            display: grid;
            gap: 14px;
            align-content: start;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .field label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #cbd5e1;
        }

        textarea, select, input[type="file"] {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        select, input[type="file"] {
            min-height: 46px;
        }

        textarea:focus, select:focus, input[type="file"]:focus {
            outline: 2px solid rgba(236, 72, 153, 0.7);
            outline-offset: 2px;
        }

        .voice-box {
            display: grid;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.35);
        }

        .voice-info {
            font-size: 12px;
            color: var(--muted);
            word-break: break-all;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .btn:hover { transform: translateY(-1px); }

        .primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            box-shadow: 0 8px 22px rgba(236, 72, 153, 0.25);
        }

        .secondary {
            background: rgba(148, 163, 184, 0.12);
            color: var(--text);
            border: 1px solid var(--line);
        }

        .btn:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        .status {
            min-height: 22px;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .status.show {
            opacity: 1;
        }

        .status.info {
            background: rgba(59, 130, 246, 0.12);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .status.success {
            background: rgba(34, 197, 94, 0.12);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.12);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .preview-head {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        .preview-box {
            width: min(100%, 300px);
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            border-radius: 18px;
            border: 2px solid var(--line);
            overflow: hidden;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            box-shadow: 0 16px 40px rgba(0,0,0,0.35);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .note {
            margin: 0;
            color: var(--muted);
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 id="title">✨ Viral Text Video Generator</h1>
            <p id="subtitle">Create a typing video using your uploaded voice</p>
        </header>

        <div class="language-selector" id="languageSelector"></div>

        <div class="grid">
            <div class="controls">
                <div class="field">
                    <label for="textInput">Your Text</label>
                    <textarea id="textInput" maxlength="220" placeholder="Type your message here...">Make something awesome!</textarea>
                </div>

                <div class="field">
                    <label for="effectSelect">Text Effect</label>
                    <select id="effectSelect"></select>
                </div>

                <div class="field">
                    <label for="bgColorSelect">Background Style</label>
                    <select id="bgColorSelect"></select>
                </div>

                <div class="field">
                    <label for="voiceMode">Voice Source</label>
                    <select id="voiceMode">
                        <option value="default">Use repo voice file</option>
                        <option value="upload">Upload a new voice file</option>
                    </select>
                </div>

                <div class="field">
                    <label for="voiceInput">Your Voice File</label>
                    <div class="voice-box">
                        <input id="voiceInput" type="file" accept="audio/*" />
                        <div class="voice-info" id="voiceInfo">Loading default repo voice...</div>
                    </div>
                </div>

                <div class="button-row">
                    <button id="generateBtn" class="btn primary">Generate Video</button>
                    <button id="previewBtn" class="btn secondary">Preview</button>
                </div>

                <div id="status" class="status"></div>
                <p class="note">Uses the repo voice by default • upload a different voice if needed • .webm export</p>
            </div>

            <div>
                <div class="preview-head">Live Preview</div>
                <div class="preview-box">
                    <canvas id="canvas" width="720" height="1280"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textInput = document.getElementById('textInput');
        const effectSelect = document.getElementById('effectSelect');
        const bgColorSelect = document.getElementById('bgColorSelect');
        const generateBtn = document.getElementById('generateBtn');
        const previewBtn = document.getElementById('previewBtn');
        const statusEl = document.getElementById('status');
        const languageSelector = document.getElementById('languageSelector');
        const voiceInput = document.getElementById('voiceInput');
        const voiceInfo = document.getElementById('voiceInfo');
        const voiceMode = document.getElementById('voiceMode');

        const DEFAULT_VOICE_PATH = 'Standard recording 32_20261008192509.mp3';
        const CANVAS_WIDTH = 720;
        const CANVAS_HEIGHT = 1280;
        const FPS = 30;
        const DEFAULT_DURATION = 15;

        let currentLanguage = 'en';
        let currentPreviewTimer = null;
        let uploadedVoiceURL = null;
        let uploadedVoiceDuration = DEFAULT_DURATION;
        let defaultVoiceReady = false;
        let defaultVoiceDuration = DEFAULT_DURATION;

        const translations = {

                statusError: 'Please enter text first.',

                voicePrompt: 'No voice uploaded yet. Upload your recorded voice and it will be used in the final video.',
                effects: {

                    'gradient-ocean': 'Ocean Blue',
                    'black': 'Solid Black'
                }
            },
            hi: {
                title: '✨ वायरल टेक्स्ट वीडियो जनरेटर',
                subtitle: 'अपनी अपलोड की गई आवाज़ के साथ टाइपिंग वीडियो बनाएं',
                textLabel: 'आपका टेक्स्ट',
                previewLabel: 'लाइव प्रीव्यू',
                generateText: 'वीडियो बनाएं',
                previewText: 'प्रीव्यू',
                statusEmpty: 'वीडियो बनाने से पहले अपनी आवाज़ अपलोड करें।',
                statusRender: 'आपकी आवाज़ के साथ वीडियो बनाया जा रहा है...',
                statusSuccess: '✅ वीडियो बन गया और डाउनलोड हो गया!',
                statusError: 'पहले टेक्स्ट लिखें।',

                voicePrompt: 'अभी कोई आवाज़ अपलोड नहीं हुई है। अपनी रिकॉर्डिंग अपलोड करें और वही आवाज़ वीडियो में उपयोग होगी।',
                effects: {
                    neon: '🌟 नेन-ग्लो',
                    typewriter: '⌨️ टाइपराइटर',
                    bounce: '🎈 बाउंस',
                    highlight: '🎬 हाइलाइट'
                },
                backgrounds: {
                    'gradient-dark': 'डार्क ग्रेडिएंट',
                    'gradient-purple': 'पर्पल वाइब्स',
                    'gradient-sunset': 'सनसेट',
                    'gradient-ocean': 'ओशन ब्लू',
                    'black': 'सॉलिड ब्लैक'
                }
            },
            gu: {
                title: '✨ वायरल ટેક્સ્ટ વિડિયો જનરેટર',
                subtitle: 'તમારી અપલોડ કરેલી અવાજ સાથે ટાઈપિંગ વિડિયો બનાવો',
                textLabel: 'તમારો ટેક્સ્ટ',
                previewLabel: 'લાઇવ પ્રીવ્યુ',
                generateText: 'વિડિયો બનાવો',
                previewText: 'પ્રીવ્યુ',
                statusEmpty: 'વિડિયો બનાવવા પહેલા તમારી અવાજ અપલોડ કરો.',
                statusRender: 'તમારી અવાજ સાથે విధિયો બનાવી રહ્યો છે...',
                statusSuccess: '✅ વિડિયો તૈયાર અને ડાઉનલોડ થઈ ગયો!',
                statusError: 'પહેલાં ટેક્સ્ટ લખી દો.',
                statusNoVoice: 'પહેલાં અવાજ ફાઇલ અપલોડ કરો.',
                voicePrompt: 'હજુ સુધી કોઈ અવાજ અપલોડ નથી. તમારી રેકોર્ડિંગ અપલોડ કરો અને તે જ અવાજ ફાઇનલ વિડિયોમાં વાપરાશે.',
                effects: {
                    neon: '🌟 નિઓન ગ્લો',
                    typewriter: '⌨️ ટાઈપરાઈટર',
                    bounce: '🎈 બાઉન્સ',
                    highlight: '🎬 હાઇલાઇટ'
                },
                backgrounds: {
                    'gradient-dark': 'ડાર્ક ગ્રેડિયન્ટ',
                    'gradient-purple': 'પર્પલ વાઇબ્સ',
                    'gradient-sunset': 'સનસેટ',
                    'gradient-ocean': 'ઓશન બ્લુ',
                    'black': 'સોલિડ બ્લેક'
                }
            }
        };

        const bgGradients = {
            'gradient-dark': { colors: ['#0f172a', '#1e293b'], angle: 135 },
            'gradient-purple': { colors: ['#2d1b69', '#6d28d9'], angle: 135 },
            'gradient-sunset': { colors: ['#7c2d12', '#ea580c'], angle: 135 },
            'gradient-ocean': { colors: ['#0c4a6e', '#0369a1'], angle: 135 },
            'black': { colors: ['#000000', '#000000'], angle: 0 }
        };

        function showStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = `status show ${type}`;
            clearTimeout(showStatus.timeoutId);
            showStatus.timeoutId = setTimeout(() => {
                statusEl.classList.remove('show');
            }, 3000);
        }

        function setupLanguages() {
            const langs = Object.keys(translations);
            languageSelector.innerHTML = '';
            langs.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = `lang-btn ${lang === currentLanguage ? 'active' : ''}`;
                btn.textContent = lang.toUpperCase();
                btn.addEventListener('click', () => setLanguage(lang));
                languageSelector.appendChild(btn);
            });
            setLanguage('en');
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            const t = translations[lang];
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.querySelector('label[for="textInput"]').textContent = t.textLabel;
            document.querySelector('label[for="effectSelect"]').textContent = 'Text Effect';
            document.querySelector('label[for="bgColorSelect"]').textContent = 'Background Style';
            document.querySelector('label[for="voiceMode"]').textContent = 'Voice Source';
            document.querySelector('label[for="voiceInput"]').textContent = 'Your Voice File';
            generateBtn.textContent = t.generateText;
            previewBtn.textContent = t.previewText;
            voiceInfo.textContent = defaultVoiceReady ? 'Default repo voice ready: ' + DEFAULT_VOICE_PATH : t.voicePrompt;

            effectSelect.innerHTML = '';
            Object.entries(t.effects).forEach(([key, label]) => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = label;
                effectSelect.appendChild(option);
            });

            bgColorSelect.innerHTML = '';
            Object.entries(t.backgrounds).forEach(([key, label]) => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = label;
                bgColorSelect.appendChild(option);
            });

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === lang.toUpperCase());
            });

            drawPreviewFrame(0, true);
        }

        function createGradient(ctxRef, bgStyle) {
            const config = bgGradients[bgStyle] || bgGradients['gradient-dark'];
            const angle = (config.angle * Math.PI) / 180;
            const x1 = CANVAS_WIDTH / 2 - Math.cos(angle) * CANVAS_WIDTH;
            const y1 = CANVAS_HEIGHT / 2 - Math.sin(angle) * CANVAS_HEIGHT;
            const x2 = CANVAS_WIDTH / 2 + Math.cos(angle) * CANVAS_WIDTH;
            const y2 = CANVAS_HEIGHT / 2 + Math.sin(angle) * CANVAS_HEIGHT;

            const gradient = ctxRef.createLinearGradient(x1, y1, x2, y2);
            gradient.addColorStop(0, config.colors[0]);
            gradient.addColorStop(1, config.colors[1]);
            return gradient;
        }

        function drawBackground(bgStyle) {
            const gradient = createGradient(ctx, bgStyle);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.fillStyle = 'rgba(236, 72, 153, 0.08)';
            for (let i = 0; i < 6; i++) {
                const x = (i * 135 + 50) % CANVAS_WIDTH;
                const y = (i * 210 + 70) % CANVAS_HEIGHT;
                const size = 30 + i * 12;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function wrapText(text, maxWidth) {
            const words = text.split(/\s+/);
            const lines = [];
            let line = '';

            words.forEach(word => {
                const candidate = line ? line + ' ' + word : word;
                if (ctx.measureText(candidate).width > maxWidth && line) {
                    lines.push(line);
                    line = word;
                } else {
                    line = candidate;
                }
            });

            if (line) lines.push(line);
            return lines.length ? lines : [''];
        }

        function drawNeon(text, frameIndex) {
            drawBackground(bgColorSelect.value);

            const progress = (frameIndex % (FPS * DEFAULT_DURATION)) / (FPS * DEFAULT_DURATION);
            const baseScale = 0.85 + Math.sin(progress * Math.PI * 2) * 0.13;
            const centerY = CANVAS_HEIGHT / 2;
            const lines = wrapText(text, 540);

            ctx.save();
            ctx.translate(CANVAS_WIDTH / 2, centerY);
            ctx.scale(baseScale, baseScale);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '700 78px Arial, sans-serif';

            const lineHeight = 92;
            const startY = -((lines.length - 1) * lineHeight) / 2;

            for (let i = 0; i < lines.length; i++) {
                const y = startY + i * lineHeight;
                for (let glow = 4; glow > 0; glow--) {
                    ctx.fillStyle = `rgba(236, 72, 153, ${0.25 / glow})`;
                    ctx.shadowColor = 'rgba(236, 72, 153, 0.9)';
                    ctx.shadowBlur = glow * 16;
                    ctx.fillText(lines[i], 0, y);
                }
                ctx.fillStyle = '#fdf2f8';
                ctx.shadowColor = '#ec4899';
                ctx.shadowBlur = 18;
                ctx.fillText(lines[i], 0, y);
            }

            ctx.restore();
        }

        function drawTypewriter(text, frameIndex) {
            drawBackground(bgColorSelect.value);

            const durationFrames = FPS * DEFAULT_DURATION;
            const progress = (frameIndex % durationFrames) / durationFrames;
            const charCount = Math.floor(progress * text.length * 2.3) % (text.length + 1);
            const lines = wrapText(text, 560);
            const displayText = lines.map((line, idx) => {
                const visibleChars = Math.max(0, charCount - idx * 10);
                return line.slice(0, visibleChars);
            }).join('\n');

            ctx.font = '700 68px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#e2e8f0';

            const yStart = CANVAS_HEIGHT / 2 - ((lines.length - 1) * 60) / 2;
            const linesToDraw = displayText.split('\n');
            linesToDraw.forEach((line, i) => {
                ctx.fillText(line, CANVAS_WIDTH / 2, yStart + i * 70);
            });

            if (charCount < text.length) {
                const lastLine = linesToDraw[linesToDraw.length - 1] || '';
                const cursorX = ctx.measureText(lastLine).width / 2 + 12;
                const cursorY = yStart + (linesToDraw.length - 1) * 70;
                ctx.fillStyle = '#ec4899';
                ctx.fillRect(CANVAS_WIDTH / 2 + cursorX, cursorY - 34, 6, 68);
            }
        }

        function drawBounce(text, frameIndex) {
            drawBackground(bgColorSelect.value);

            const progress = (frameIndex % (FPS * DEFAULT_DURATION)) / (FPS * DEFAULT_DURATION);
            const bounce = Math.abs(Math.sin(progress * Math.PI * 2));
            const scale = 0.7 + bounce * 0.35;
            const offsetY = bounce * 60;
            const lines = wrapText(text, 520);

            ctx.save();
            ctx.translate(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
            ctx.scale(scale, scale);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '700 74px Arial, sans-serif';

            const gradient = ctx.createLinearGradient(-200, -50, 200, 50);
            gradient.addColorStop(0, '#ec4899');
            gradient.addColorStop(0.5, '#f97316');
            gradient.addColorStop(1, '#ec4899');
            ctx.fillStyle = gradient;

            const startY = -((lines.length - 1) * 80) / 2 + offsetY;
            lines.forEach((line, i) => {
                ctx.fillText(line, 0, startY + i * 80);
            });

            ctx.restore();
        }

        function drawHighlight(text, frameIndex) {
            drawBackground(bgColorSelect.value);

            const progress = (frameIndex % (FPS * DEFAULT_DURATION)) / (FPS * DEFAULT_DURATION);
            const highlightProgress = Math.abs(Math.sin(progress * Math.PI * 2));
            const lines = wrapText(text, 520);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '700 74px Arial, sans-serif';

            const startY = CANVAS_HEIGHT / 2 - ((lines.length - 1) * 80) / 2;
            lines.forEach((line, i) => {
                const y = startY + i * 80;
                const textWidth = ctx.measureText(line).width;
                ctx.fillStyle = `rgba(236, 72, 153, ${0.2 + highlightProgress * 0.3})`;
                ctx.shadowColor = 'rgba(236, 72, 153, 0.5)';
                ctx.shadowBlur = 18;
                ctx.fillRect(CANVAS_WIDTH / 2 - textWidth / 2 - 24, y - 42, textWidth + 48, 82);
                ctx.fillStyle = '#fbbf24';
                ctx.shadowColor = '#fbbf24';
                ctx.shadowBlur = 8;
                ctx.fillText(line, CANVAS_WIDTH / 2, y);
            });
        }

        function drawPreviewFrame(frameIndex, force) {
            const text = textInput.value.trim() || 'Type your message...';
            const effect = effectSelect.value;

            switch (effect) {
                case 'neon': drawNeon(text, frameIndex); break;
                case 'typewriter': drawTypewriter(text, frameIndex); break;
                case 'bounce': drawBounce(text, frameIndex); break;
                case 'highlight': drawHighlight(text, frameIndex); break;
                default: drawNeon(text, frameIndex);
            }
        }

        function startPreviewLoop() {
            clearInterval(currentPreviewTimer);
            let frame = 0;
            currentPreviewTimer = setInterval(() => {
                drawPreviewFrame(frame++);
            }, 1000 / FPS);
        }

        function handleVoiceUpload() {
            const file = voiceInput.files[0];
            if (!file) {
                uploadedVoiceURL = null;
                uploadedVoiceDuration = DEFAULT_DURATION;
                voiceInfo.textContent = translations[currentLanguage].voicePrompt;
                return;
            }

            if (uploadedVoiceURL) {
                URL.revokeObjectURL(uploadedVoiceURL);
            }

            uploadedVoiceURL = URL.createObjectURL(file);
            const audio = new Audio(uploadedVoiceURL);
            audio.addEventListener('loadedmetadata', () => {
                uploadedVoiceDuration = Math.max(3, Math.min(audio.duration || DEFAULT_DURATION, 30));
                voiceInfo.textContent = 'Uploaded voice ready: ' + file.name + ' (' + uploadedVoiceDuration.toFixed(1) + 's)';
            }, { once: true });
            voiceInfo.textContent = 'Loading voice file...';
        }

        async function loadDefaultVoice() {
            try {
                const audio = new Audio(DEFAULT_VOICE_PATH);
                audio.preload = 'auto';
                await new Promise((resolve, reject) => {
                    audio.onloadedmetadata = resolve;
                    audio.onerror = reject;
                });
                defaultVoiceReady = true;
                defaultVoiceDuration = Math.max(3, Math.min(audio.duration || DEFAULT_DURATION, 30));
                voiceInfo.textContent = 'Default repo voice ready: ' + DEFAULT_VOICE_PATH + ' (' + defaultVoiceDuration.toFixed(1) + 's)';
            } catch (error) {
                defaultVoiceReady = false;
                voiceInfo.textContent = 'Default voice not available. Upload a voice file to continue.';
            }
        }

        function getAudioForGeneration() {
            if (voiceMode.value === 'upload' && voiceInput.files[0]) {
                return { type: 'file', file: voiceInput.files[0] };
            }
            if (defaultVoiceReady) {
                return { type: 'default', file: DEFAULT_VOICE_PATH };
            }
            return null;
        }

        async function generateVideo() {
            const text = textInput.value.trim();
            if (!text) {
                showStatus(translations[currentLanguage].statusError, 'error');
                return;
            }

            const selectedVoice = getAudioForGeneration();
            if (!selectedVoice) {
                showStatus(translations[currentLanguage].statusNoVoice, 'error');
                return;
            }

            const audio = new Audio(selectedVoice.type === 'file' ? URL.createObjectURL(selectedVoice.file) : selectedVoice.file);
            audio.preload = 'auto';

            await new Promise((resolve, reject) => {
                audio.onloadedmetadata = resolve;
                audio.onerror = reject;
            });

            const videoDuration = Math.max(3, Math.min(audio.duration || DEFAULT_DURATION, 30));
            const totalFrames = Math.ceil(videoDuration * FPS);
            const canvasStream = canvas.captureStream(FPS);

            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaElementSource(audio);
            const destination = audioContext.createMediaStreamDestination();
            source.connect(destination);
            source.connect(audioContext.destination);

            const mixedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...destination.stream.getAudioTracks()
            ]);

            const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                ? 'video/webm;codecs=vp9'
                : 'video/webm';

            const recorder = new MediaRecorder(mixedStream, { mimeType });
            const chunks = [];

            recorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'viral-text-video-' + Date.now() + '.webm';
                a.click();
                URL.revokeObjectURL(url);
                showStatus(translations[currentLanguage].statusSuccess, 'success');
                generateBtn.disabled = false;
                audio.pause();
                audio.currentTime = 0;
                audioContext.close();
            };

            recorder.start();
            generateBtn.disabled = true;
            showStatus(translations[currentLanguage].statusRender, 'info');

            const start = performance.now();
            const animateFrame = (timestamp) => {
                const elapsed = (timestamp - start) / 1000;
                const frameIndex = Math.min(totalFrames - 1, Math.floor(elapsed * FPS));
                drawPreviewFrame(frameIndex, true);

                if (elapsed < videoDuration) {
                    requestAnimationFrame(animateFrame);
                } else {
                    recorder.stop();
                }
            };

            audio.play();
            requestAnimationFrame(animateFrame);
        }

        textInput.addEventListener('input', () => drawPreviewFrame(0, true));
        effectSelect.addEventListener('change', () => drawPreviewFrame(0, true));
        bgColorSelect.addEventListener('change', () => drawPreviewFrame(0, true));
        generateBtn.addEventListener('click', generateVideo);
        previewBtn.addEventListener('click', () => {
            if (!textInput.value.trim()) {
                showStatus(translations[currentLanguage].statusError, 'error');
                return;
            }
            startPreviewLoop();
            showStatus('Preview playing...', 'info');
        });
        voiceInput.addEventListener('change', handleVoiceUpload);
        voiceMode.addEventListener('change', () => {
            if (voiceMode.value === 'default') {
                if (!defaultVoiceReady) {
                    loadDefaultVoice();
                } else {
                    voiceInfo.textContent = 'Default repo voice ready: ' + DEFAULT_VOICE_PATH + ' (' + defaultVoiceDuration.toFixed(1) + 's)';
                }
            } else {
                if (voiceInput.files[0]) {
                    voiceInfo.textContent = 'Uploaded voice ready: ' + voiceInput.files[0].name;
                } else {
                    voiceInfo.textContent = 'Upload a voice file to use in the final video.';
                }
            }
        });

        setupLanguages();
        drawPreviewFrame(0, true);
        startPreviewLoop();
        loadDefaultVoice();
    </script>
</body>
</html>
