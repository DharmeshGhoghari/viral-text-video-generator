<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Typing Text Video Generator</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e2e8f0;background:linear-gradient(135deg,#0f172a,#1e293b)}.app{width:min(920px,100%);padding:24px;border:1px solid #334155;border-radius:24px;background:#0f172add;box-shadow:0 20px 60px #0008}.head{text-align:center;margin-bottom:20px}.head h1{margin:0 0 8px;font-size:clamp(24px,5vw,34px);background:linear-gradient(90deg,#ec4899,#f97316);color:transparent;background-clip:text}.head p{margin:0;color:#94a3b8;font-size:14px}.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:18px 0}.lang{padding:7px 10px;border:1px solid #475569;border-radius:9px;background:#1e293b;color:#cbd5e1;font-weight:700;font-size:11px;cursor:pointer}.lang.active{border-color:#ec4899;background:linear-gradient(135deg,#ec4899,#f97316);color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:24px}@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}.controls{display:grid;align-content:start;gap:15px}label{display:grid;gap:7px;color:#cbd5e1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}textarea,select{width:100%;padding:13px 14px;border:1px solid #475569;border-radius:12px;background:#1e293b;color:#f8fafc;font:inherit;font-size:16px;resize:vertical}textarea:focus,select:focus{outline:2px solid #ec4899;outline-offset:1px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:13px;border:0;border-radius:12px;font:700 14px inherit;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,#ec4899,#f97316);box-shadow:0 8px 22px #ec489955}.secondary{color:#e2e8f0;background:#334155}.btn:disabled{opacity:.55;cursor:wait}.status{min-height:20px;padding:10px;border-radius:10px;text-align:center;font-size:13px}.status:empty{padding:0}.status.info{background:#1d4ed822;color:#93c5fd}.status.ok{background:#16a34a22;color:#86efac}.status.error{background:#dc262622;color:#fca5a5}.preview-title{font-size:12px;font-weight:700;color:#cbd5e1;text-transform:uppercase;letter-spacing:.06em}.preview{width:min(100%,280px);aspect-ratio:9/16;margin:auto;border:2px solid #475569;border-radius:16px;overflow:hidden;background:#020617;box-shadow:0 16px 40px #0008}.preview canvas{width:100%;height:100%;display:block}.note{margin:0;text-align:center;color:#64748b;font-size:12px}
</style>
</head>
<body>
<main class="app"><header class="head"><h1>⌨️ Typing Text Video Generator</h1><p id="subtitle">Create a 15-second 9:16 video for Shorts and Reels</p></header><nav class="langs" id="langs" aria-label="Language"></nav><section class="grid"><div class="controls"><label id="textLabel">Your Text<textarea id="text" maxlength="200" rows="3" placeholder="Type your message...">Make something awesome!</textarea></label><label id="bgLabel">Background<select id="background"><option value="dark">Dark Gradient</option><option value="purple">Purple Vibes</option><option value="sunset">Sunset</option><option value="ocean">Ocean Blue</option><option value="black">Solid Black</option></select></label><div class="buttons"><button class="btn primary" id="generate">🎬 Generate Video</button><button class="btn secondary" id="preview">▶ Preview</button></div><div class="status" id="status"></div><p class="note">Typing effect only • 15 seconds • 720×1280 • 30 FPS • .webm</p></div><div><div class="preview-title">Live Preview</div><div class="preview"><canvas id="canvas" width="720" height="1280"></canvas></div></div></section></main>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),text=$('text'),bg=$('background'),status=$('status'),W=720,H=1280,FPS=30,FRAMES=450;
const bgMap={dark:['#0f172a','#1e293b'],purple:['#2d1b69','#6d28d9'],sunset:['#7c2d12','#ea580c'],ocean:['#0c4a6e','#0369a1'],black:['#000','#000']};
const languages={en:['English','Your Text','Background','Live Preview','Type your message...'],es:['Español','Tu texto','Fondo','Vista previa','Escribe tu mensaje...'],fr:['Français','Votre texte','Arrière-plan','Aperçu','Écrivez votre message...'],de:['Deutsch','Ihr Text','Hintergrund','Live-Vorschau','Ihre Nachricht eingeben...'],it:['Italiano','Il tuo testo','Sfondo','Anteprima','Scrivi il tuo messaggio...'],pt:['Português','Seu texto','Fundo','Visualização','Digite sua mensagem...'],ja:['日本語','テキスト','背景','ライブプレビュー','メッセージを入力...'],zh:['中文','您的文本','背景','实时预览','输入您的消息...'],ar:['العربية','نصك','الخلفية','معاينة مباشرة','اكتب رسالتك...'],ko:['한국어','텍스트','배경','라이브 미리보기','메시지를 입력하세요...'],ru:['Русский','Ваш текст','Фон','Предпросмотр','Введите сообщение...']};
let timer,lang='en';
$('langs').innerHTML=Object.keys(languages).map(k=>`<button class="lang ${k==='en'?'active':''}" data-lang="${k}">${k.toUpperCase()}</button>`).join('');$('langs').onclick=e=>{if(e.target.dataset.lang)setLanguage(e.target.dataset.lang)};
function setLanguage(k){lang=k;const t=languages[k];$('textLabel').childNodes[0].textContent=t[1];$('bgLabel').childNodes[0].textContent=t[2];document.querySelector('.preview-title').textContent=t[3];text.placeholder=t[4];$('subtitle').textContent=k==='en'?'Create a 15-second 9:16 video for Shorts and Reels':'15-second 9:16 vertical typing video';document.documentElement.lang=k;document.documentElement.dir=k==='ar'?'rtl':'ltr';document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===k));draw(0)}
function background(c){const g=c.createLinearGradient(0,0,W,H),colors=bgMap[bg.value]||bgMap.dark;g.addColorStop(0,colors[0]);g.addColorStop(1,colors[1]);c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#ec489915';for(let i=0;i<6;i++){c.beginPath();c.arc((i*149+40)%W,(i*271+90)%H,35+i*8,0,Math.PI*2);c.fill()}}
// Creates the final line layout first, so the text stays in the same position while characters appear.
function layout(c,value,maxWidth){c.font='700 56px system-ui,sans-serif';const lines=[];value.split('\n').forEach(paragraph=>{if(!paragraph){lines.push('');return}let line='';paragraph.split(/\s+/).forEach(word=>{const candidate=line?line+' '+word:word;if(c.measureText(candidate).width>maxWidth&&line){lines.push(line);line=word}else line=candidate});if(line)lines.push(line)});return lines.length?lines:['']}
function draw(frame,c=ctx){background(c);const value=text.value.trim()||'Type your message...';const finalLines=layout(c,value,600);const reveal=Math.min(value.length,Math.floor((frame/(FRAMES-1))*value.length*1.4));let remaining=reveal,visible=[];for(const line of finalLines){const take=Math.min(line.length,remaining);visible.push(line.slice(0,take));remaining-=take;if(remaining<=0)break}const shown=visible.join('\n');const pulse=.95+Math.sin(frame/10)*.02;c.save();c.translate(W/2,H/2);c.scale(pulse,pulse);c.font='700 56px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.shadowColor='#ec4899';c.shadowBlur=16;c.fillStyle='#f8fafc';const lineHeight=80,startY=-((finalLines.length-1)*lineHeight)/2;visible.forEach((line,i)=>c.fillText(line,0,startY+i*lineHeight));if(reveal<value.length||frame%30<18){const currentLine=visible[visible.length-1]||'';const lineIndex=Math.max(0,visible.length-1);const cursorX=c.measureText(currentLine)/2+8,cursorY=startY+lineIndex*lineHeight;c.shadowBlur=0;c.fillStyle='#ec4899';c.fillRect(cursorX,cursorY-28,5,56)}c.restore()}
function show(message,type='info'){status.textContent=message;status.className='status '+type}function animate(){clearInterval(timer);let f=0;timer=setInterval(()=>draw(f++%FRAMES),1000/FPS)}
$('preview').onclick=()=>{animate();show('Preview playing...')};text.oninput=()=>{draw(0);animate()};bg.onchange=()=>draw(0);animate();
$('generate').onclick=()=>{if(!text.value.trim()){show('Please enter some text!','error');return}if(!window.MediaRecorder||!canvas.captureStream){show('This browser does not support video recording.','error');return}const button=$('generate');button.disabled=true;show('Rendering 15-second video...');const out=document.createElement('canvas');out.width=W;out.height=H;const stream=out.captureStream(FPS),outCtx=out.getContext('2d');let mime='video/webm;codecs=vp9';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000}),chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:'video/webm'})),a=document.createElement('a');a.href=url;a.download='typing-video-'+Date.now()+'.webm';a.click();URL.revokeObjectURL(url);button.disabled=false;show('✅ Video generated and downloaded!','ok')};recorder.onerror=()=>{button.disabled=false;show('Recording error. Try again.','error')};recorder.start();let f=0;const tick=()=>{draw(f++,outCtx);if(f<FRAMES)requestAnimationFrame(tick);else recorder.stop()};tick()};
</script></body></html>
